<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d233a" />
      <stop offset="100%" stop-color="#050d18" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d9bf0" />
      <stop offset="60%" stop-color="#60c5ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d9bf0" stop-opacity="0" />
      <stop offset="100%" stop-color="#1d9bf0" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#1d9bf0" stroke-width="2" stroke-opacity="0.4" />

  <!-- Dynamic speed orbital arc -->
  <path d="M 22 76 C 20 54 36 32 60 26 C 70 23 80 26 84 32 C 86 35 84 40 78 44 C 70 50 56 56 36 66" 
        fill="none" stroke="url(#trailGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Supersonic Airliner / Jet Silhouette in Flight -->
  <g transform="translate(50, 50) rotate(-42) translate(-50, -50)">
    <!-- Main Fuselage -->
    <path d="M 50 16 C 52 16 54 22 54 34 L 54 68 C 54 75 52 82 50 84 C 48 82 46 75 46 68 L 46 34 C 46 22 48 16 50 16 Z" 
          fill="url(#planeGrad)" />
    <!-- Swept Wings -->
    <path d="M 50 36 L 86 64 C 88 66 87 68 84 68 L 74 68 L 54 52 L 46 52 L 26 68 L 16 68 C 13 68 12 66 14 64 L 50 36 Z" 
          fill="#ffffff" />
    <!-- Winglets -->
    <path d="M 86 64 L 88 58 L 84 64 Z" fill="#1d9bf0" />
    <path d="M 14 64 L 12 58 L 16 64 Z" fill="#1d9bf0" />
    <!-- Tail Fin (Vertical Stabilizer) -->
    <path d="M 50 64 L 52 80 L 48 80 Z" fill="#1d9bf0" />
    <!-- Horizontal Tailplanes -->
    <path d="M 50 72 L 66 82 L 62 85 L 50 77 L 38 85 L 34 82 Z" fill="#ffffff" opacity="0.9" />
    <!-- Cockpit Glass Reflection -->
    <ellipse cx="50" cy="25" rx="1.8" ry="4" fill="#0d233a" opacity="0.7" />
  </g>
</svg>
